apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_intervals: 15s
    scrape_configs:
      - job_name: 'my-app-metrics'
        static_configs:
          - targets: ['my-app-metrics:9113']
    rule_files:
      - /etc/prometheus/rules/*.yaml
